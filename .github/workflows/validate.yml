name: Validate Namqula
on:
  pull_request:
  push:
    branches: [codex/namqula-data-and-performance]
permissions:
  contents: read
jobs:
  game-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: namqula-production-preview
          path: dist
          retention-days: 3
